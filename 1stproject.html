<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>

    .countainer{
      background-color: rgb(220, 190, 190);
      width: 900px;
      height: 650px;
      margin-left: 550px;
      margin-top: 100px;
    }

    .main{
      background-color: white;
      border: 20px solid rgb(220, 190, 190);
      width: 800px;
      height: 90%;
      margin-left: 30px;
    }

    .pic{
      width: 760px;
      border-radius: 20px;
      margin-left: 20px;
      margin-top: 20px;
    }

    .nev{
      margin-left: 240px;
      font-family: Georgia;
      margin-top: 10px;
    }

    .nev span{
      padding: 10px;
    }

    .nev button{
      border-radius: 20px;
      border: 1px solid rgb(120, 80, 80);
      background-color: pink;
      margin-left: 100px;
      font-family: Georgia;
    }

    .button2{
      border-radius: 20px;
      border: 1px solid rgb(120, 80, 80);
      background-color: rgb(220, 190, 190);
      width: 80px;
      padding: 5px;
      color: black;
    }

    .contant{
      position: relative;
      left: 40px;
      top: 180px;
      color: white;
      font-family: Georgia;
      margin-left: 10px;
    }

    .photo{
      position: absolute;
    }

  </style>
</head>

<body>

  <div class="countainer">

    <div class="main">

      <div class="nev">
        <span>About</span>
        <span>Services</span>
        <span>Case study</span>
        <span>Articles</span>
        <button>Contact us</button>
      </div>

      <div class="photo">
        <img class="pic" src="https://i.pinimg.com/736x/bd/6a/fc/bd6afccec721e72fb04ceef504929828.jpg" alt="atifa">
      </div>

      <div class="contant">

        <h1>Creative Ideas</h1>
        <h1>Better Results.</h1>

        <p>
          We create simple and useful ideas
          <br>
          that help people grow and achieve
          <br>
          better results.
        </p>

        <div class="button2">Get started</div>

      </div>

    </div>

  </div>

</body>
</html>
